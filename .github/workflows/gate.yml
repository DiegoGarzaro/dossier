name: Gate

# The one definition of "green": backend (ruff + pytest), frontend (build +
# vitest), and a multi-arch Docker build validation. `ci.yml` calls this on
# every push/PR; `release.yml` calls the same thing before it will publish
# anything, so a release can never skip the 124 backend + 26 frontend tests.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # astral-sh/setup-uv no longer publishes moving major-version tags
      # (e.g. "@v9") — only immutable full-version tags. Pinned to the
      # latest full version as the closest equivalent.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc --noEmit + vite build)
        run: npm run build

      - name: Test (vitest)
        run: npm run test

  docker:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Required to build the linux/arm64 leg via emulation on the
      # amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Validates the multi-arch build only — no push, no registry
      # credentials here. The release workflow's publish job pushes the
      # real thing afterwards, in a separate job with narrower permissions;
      # the shared `type=gha` cache makes that second build cheap.
      - name: Build image (no push — validates the build only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
